<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>ERÇİN AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f5f5;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:780px;margin:auto;min-height:100svh;display:flex;flex-direction:column;padding:16px}header{display:flex;align-items:center;gap:12px;padding:12px 4px 18px;border-bottom:1px solid #292930}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ff4655,#8d0714);display:grid;place-items:center;font-size:22px;font-weight:900}h1{font-size:18px;letter-spacing:2px;margin:0}header small{color:#aaa;letter-spacing:1px}#chat{flex:1;overflow:auto;padding:22px 0;display:flex;flex-direction:column;gap:14px}.welcome{text-align:center;margin:auto;padding:24px 8px}.welcome b{font-size:48px;color:#ef3344}.welcome h2{font-size:26px;margin:6px}.welcome p{color:#aaa;line-height:1.5}.msg{display:flex;gap:9px;align-items:flex-start}.msg.user{justify-content:flex-end}.bubble{max-width:84%;padding:12px 15px;border-radius:16px;background:#1b1b21;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#781421}.avatar{width:30px;height:30px;flex:0 0 30px;border-radius:10px;background:#292930;color:#ff6572;display:grid;place-items:center;font-weight:bold}form{display:flex;gap:9px;padding:10px;background:#17171c;border:1px solid #393941;border-radius:17px}textarea{flex:1;min-width:0;resize:none;max-height:120px;min-height:42px;border:0;outline:0;background:transparent;color:white;font:inherit;padding:10px}textarea::placeholder{color:#85858e}button{width:48px;border:0;border-radius:12px;background:#e11d2e;color:white;font-size:22px;cursor:pointer}button:disabled{opacity:.5}.note{text-align:center;color:#777;font-size:11px;padding:8px}
</style></head><body><div class="app"><header><div class="logo">E</div><div><h1>ERÇİN AI</h1><small>YAPAY ZEKÂ ASİSTANI</small></div></header><main id="chat"><div class="welcome" id="welcome"><b>✦</b><h2>Merhaba, hoş geldin.</h2><p>Ben ERÇİN AI. Bana bir soru yaz, yanıtlayayım.</p></div></main><form id="form"><textarea id="input" rows="1" placeholder="Mesajını yaz..." aria-label="Mesajını yaz"></textarea><button id="send" type="submit" aria-label="Gönder">➤</button></form><div class="note">ERÇİN AI · Yapay zekâ destekli sohbet</div></div>
<script>
const form=document.getElementById('form'), input=document.getElementById('input'), chat=document.getElementById('chat'), send=document.getElementById('send');
const history=[];
function add(text,role){document.getElementById('welcome')?.remove();const row=document.createElement('div');row.className='msg '+(role==='user'?'user':'assistant');const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'S':'E';const b=document.createElement('div');b.className='bubble';b.textContent=text;if(role==='user')row.append(b,av);else row.append(av,b);chat.append(row);chat.scrollTop=chat.scrollHeight;return b;}
form.addEventListener('submit',async e=>{e.preventDefault();const q=input.value.trim();if(!q||send.disabled)return;input.value='';add(q,'user');history.push({role:'user',content:q});send.disabled=true;send.textContent='…';const pending=add('Yanıt hazırlanıyor…','assistant');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Bir hata oluştu.');pending.textContent=data.answer;history.push({role:'assistant',content:data.answer});}catch(err){pending.textContent='Bağlantı hatası: '+err.message;}finally{send.disabled=false;send.textContent='➤';input.focus();}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
</script></body></html>
